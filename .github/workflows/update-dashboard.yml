name: Update Dashboard

on:
  schedule:
    # Weekly, Sunday 18:00 UTC (project brief section 11). Can be tightened
    # to daily later if school information changes more frequently.
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.stage.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Install Playwright Chromium
        run: npm run playwright:install

      - name: Build frontend
        run: npm run build:frontend

      - name: Run update pipeline
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_MS: ${{ secrets.AI_TIMEOUT_MS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCHOOL_PORTAL_LOGIN_URL: ${{ secrets.SCHOOL_PORTAL_LOGIN_URL }}
          SCHOOL_PORTAL_USERNAME: ${{ secrets.SCHOOL_PORTAL_USERNAME }}
          SCHOOL_PORTAL_PASSWORD: ${{ secrets.SCHOOL_PORTAL_PASSWORD }}
          # Referenced indirectly via urlEnv/filterFromEnv in data/sources.json
          # so real addresses/URLs never appear in the committed, public file.
          SCHOOL_PORTAL_ANNOUNCEMENTS_URL: ${{ secrets.SCHOOL_PORTAL_ANNOUNCEMENTS_URL }}
          GMAIL_FILTER_COMMUNICATIONS: ${{ secrets.GMAIL_FILTER_COMMUNICATIONS }}
          GMAIL_FILTER_MASS_EMAILS: ${{ secrets.GMAIL_FILTER_MASS_EMAILS }}
          GMAIL_FILTER_TEACHER: ${{ secrets.GMAIL_FILTER_TEACHER }}
          GMAIL_FILTER_CLASSDOJO: ${{ secrets.GMAIL_FILTER_CLASSDOJO }}
        run: npm run pipeline

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/current-week.json output/whatsapp-message.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update dashboard data [skip ci]"
            git push
          fi

      # The frontend fetches "data/events.json" relative to index.html, so
      # the published Pages site needs a copy of the current data alongside
      # the built public/ assets. data/sources.json and pending-review.json
      # are intentionally left out — they're pipeline-internal, not needed
      # by the frontend.
      - name: Stage data for Pages
        id: stage
        run: |
          mkdir -p public/data
          cp data/events.json public/data/events.json
          cp data/current-week.json public/data/current-week.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    if: needs.update.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
