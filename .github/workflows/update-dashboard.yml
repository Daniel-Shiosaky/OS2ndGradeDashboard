name: Update Dashboard

on:
  schedule:
    # Weekly, Sunday 18:00 UTC (project brief section 11). Can be tightened
    # to daily later if school information changes more frequently.
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

permissions:
  # read-only: generated data is no longer committed back to the repo.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "update-dashboard"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.stage.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Install Playwright Chromium
        run: npm run playwright:install

      - name: Build frontend
        run: npm run build:frontend

      # The Newsletter and ClassDojo lanes need an interactive login, so CI cannot
      # fetch them. A local `npm run publish-data` pushes this machine's
      # events.json to the `data` branch; restoring it here makes it the previous
      # state that this run's email fetch is merged onto. With no data branch yet
      # (or an unreadable file) generateDashboard falls back to the live site.
      - name: Restore published local data
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:events.json > data/events.json
            echo "Restored data/events.json from the data branch"
          else
            echo "No data branch yet; the pipeline will recover from the live site"
          fi

      - name: Run update pipeline
        id: pipeline
        # Non-fatal on purpose, so the steps below still run after a failure.
        # data/events.json is gitignored, so a fresh runner has no previous data:
        # it exists only if this run got as far as writing it (generateDashboard
        # recovers the previous state from DASHBOARD_URL first). If the pipeline
        # died earlier, validation below fails, nothing is staged, and the
        # existing deployment simply stays live. Either way the run is marked
        # failed by the final step of this job.
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_MS: ${{ secrets.AI_TIMEOUT_MS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          CLASSDOJO_EMAIL: ${{ secrets.CLASSDOJO_EMAIL }}
          CLASSDOJO_PASSWORD: ${{ secrets.CLASSDOJO_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Referenced indirectly via filterFromEnv in data/sources.json so real
          # addresses never appear in the committed, public file.
          GMAIL_FILTER_COMMUNICATIONS: ${{ secrets.GMAIL_FILTER_COMMUNICATIONS }}
          GMAIL_FILTER_MASS_EMAILS: ${{ secrets.GMAIL_FILTER_MASS_EMAILS }}
          GMAIL_FILTER_TEACHER: ${{ secrets.GMAIL_FILTER_TEACHER }}
          # Calendar lane: a public iCalendar feed, so it needs no login and runs in CI.
          # The feed URL holds a private token (secret); the page URL is what the
          # dashboard links to.
          MYOS_CALENDAR_FEED_URL: ${{ secrets.MYOS_CALENDAR_FEED_URL }}
          MYOS_CALENDAR_PAGE_URL: ${{ secrets.MYOS_CALENDAR_PAGE_URL }}
          # REQUIRED for the email lane's privacy filter. Without REDACT_NAMES the
          # "message names the child" gate silently no-ops, and without
          # MAIL_BULK_DOMAINS the school's mass-mailer is not recognised as a
          # broadcast. Both must be set as secrets for a scheduled run.
          REDACT_NAMES: ${{ secrets.REDACT_NAMES }}
          MAIL_BULK_DOMAINS: ${{ secrets.MAIL_BULK_DOMAINS }}
          # DASHBOARD_URL doubles as the recovery source for previous state, since
          # data/events.json is no longer committed. No SCHOOL_PORTAL_* here: the
          # portal login can demand a human, so the Newsletter and ClassDojo lanes
          # are not fetched in CI; they are carried over from the published site.
        run: npm run pipeline

      # Gates both paths: on success this re-checks what the pipeline just
      # wrote; after a failure it checks whatever the pipeline managed to write,
      # and fails if there is nothing valid. Failing here stops the job before
      # anything is staged, so the existing deployment stays live.
      - name: Validate publishable data
        run: npm run validate-data

      # The frontend fetches "data/events.json" relative to index.html, so
      # the published Pages site needs a copy of the current data alongside
      # the built public/ assets. data/sources.json and pending-review.json
      # are intentionally left out — they're pipeline-internal, not needed
      # by the frontend.
      - name: Stage data for Pages
        id: stage
        run: |
          mkdir -p public/data
          cp data/events.json public/data/events.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # Last, so the previous valid data has already been staged for deploy.
      - name: Fail the run if the pipeline did not succeed
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "::error::Update pipeline failed; publishing the previously committed data instead."
          exit 1

  deploy:
    needs: update
    # !cancelled() rather than success(): a failed update job still deploys,
    # provided staging actually produced an artifact from valid data. Without
    # it, GitHub skips this job whenever `update` is red.
    if: ${{ !cancelled() && needs.update.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
